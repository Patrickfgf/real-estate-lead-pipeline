# Ruff — linter e formatador do Projeto Jaré.
# Roda no CI (.github/workflows/ci.yml) e localmente: `ruff check` / `ruff format`.
target-version = "py311"   # menor versão suportada (ver badge no README)
line-length = 120

# Script auxiliar de geração de PDF (reportlab) — ferramenta, não faz parte do
# pipeline; fica fora do lint da aplicação.
extend-exclude = ["gerar_pdf.py"]

[lint]
# Conjunto pragmático: erros/pyflakes (E,F), imports ordenados (I), modernização
# de sintaxe (UP), bugbear (B), comprehensions (C4) e blind-except (BLE — casa com
# os `# noqa: BLE001` dos catches best-effort intencionais).
select = ["E", "F", "I", "UP", "B", "C4", "BLE"]
